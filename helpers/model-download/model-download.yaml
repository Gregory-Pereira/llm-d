apiVersion: batch/v1
kind: Job
metadata:
  generateName: model-download-
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 0
      containers:
        - name: download
          image: vllm/vllm-openai:nightly
          command:
            - /bin/bash
            - -c
          args:
            - |-
              set -e
              echo "Downloading $(MODEL) to /mnt/hf-cache ..."
              hf download $(MODEL)
              echo "Download complete."
          env:
            - name: MODEL
              value: moonshotai/Kimi-K3  # <-- change this
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: HF_HOME
              value: /mnt/hf-cache
          resources:
            requests:
              cpu: 4
              memory: 16Gi
            limits:
              cpu: 8
              memory: 32Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /mnt/hf-cache
      volumes:
        - name: hf-cache
          hostPath:
            path: /mnt/local/hf-cache
            type: DirectoryOrCreate
