apiVersion: v1
kind: ConfigMap
metadata:
  name: roce-hca-discovery-script
data:
  discover.sh: |
    #!/bin/bash
    set -e

    # --- SCRIPT CONFIGURATION ---
    WAIT_TIMEOUT="${WAIT_TIMEOUT:-300}"
    WAIT_INTERVAL="${WAIT_INTERVAL:-5}"
    LEADER_IP_KEY="vllm_leader_ip"
    LEADER_LOCK_KEY="vllm_leader_lock"
    LEASE_SECONDS=15
    HEARTBEAT_INTERVAL=5

    echo "--- Running discovery script (Redis Lock-based Election) ---" >&2

    # --- VALIDATE PREREQUISITES ---
    if [[ -z "$REDIS_HOST" ]]; then
        echo "Error: The REDIS_HOST environment variable must be set." >&2
        exit 1
    fi
    if [[ -z "$PRIMARY_IFNAME" ]]; then
        echo "Error: The PRIMARY_IFNAME environment variable must be set (e.g., 'net1')." >&2
        exit 1
    fi
    # New check for LWS_WORKER_INDEX
    if [[ -z "$LWS_WORKER_INDEX" ]]; then
        echo "Error: The LWS_WORKER_INDEX environment variable must be set." >&2
        exit 1
    fi
    if ! python3 -c "import redis" &> /dev/null; then
        echo "Error: The 'redis' Python library is not installed in this container." >&2
        exit 1
    fi

    # --- STEP 1: DISCOVER LOCAL IP ---
    primary_ifname="${PRIMARY_IFNAME}"
    local_primary_ip=$(ip -4 addr show "${primary_ifname}" | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
    hostname=$(cat /etc/hostname)

    if [[ -z "$local_primary_ip" ]]; then
        echo "Error: Could not find IP for the interface specified by PRIMARY_IFNAME: ${primary_ifname}" >&2
        exit 1
    fi

    echo "Info: Primary local interface for this pod is ${primary_ifname} with IP ${local_primary_ip}" >&2

    # --- STEP 2: LEADER ELECTION & VARIABLE ASSIGNMENT ---

    run_leader_heartbeat() {
      while true; do
        python3 -c "import redis, sys; r = redis.Redis(host=sys.argv[1]); r.expire(sys.argv[2], int(sys.argv[3])); r.expire(sys.argv[4], int(sys.argv[3]))" "$REDIS_HOST" "$LEADER_LOCK_KEY" "$LEASE_SECONDS" "$LEADER_IP_KEY"
        sleep "$HEARTBEAT_INTERVAL"
      done
    }

    # Check LWS_WORKER_INDEX to determine leadership
    if [[ "$LWS_WORKER_INDEX" -eq 0 ]] && ! [[ "$hostname" =~ "prefill" ]]; then
        # --- LEADER LOGIC ---
        echo "Info: LWS_WORKER_INDEX is 0. This pod is the designated leader. Starting heartbeat..." >&2
        FINAL_LEADER_IP="$local_primary_ip"

        # Set both the lock and the leader IP with an expiry time (lease)
        python3 -c "import redis, sys; r = redis.Redis(host=sys.argv[1]); r.set(sys.argv[2], sys.argv[3], ex=int(sys.argv[4])); r.set(sys.argv[5], sys.argv[6], ex=int(sys.argv[4]))" "$REDIS_HOST" "$LEADER_LOCK_KEY" "$hostname" "$LEASE_SECONDS" "$LEADER_IP_KEY" "$FINAL_LEADER_IP"

        # Start background task to renew the lease
        run_leader_heartbeat &
    else
        # --- WORKER LOGIC ---
        echo "Info: LWS_WORKER_INDEX is not 0. This pod is a worker. Waiting for the designated leader's IP in Redis..." >&2
        elapsed_time=0
        while [[ $elapsed_time -lt $WAIT_TIMEOUT ]]; do
            # Attempt to retrieve the leader IP from Redis
            leader_ip_from_redis=$(python3 -c "import redis, sys; r = redis.Redis(host=sys.argv[1], decode_responses=True); val = r.get(sys.argv[2]); print(val if val is not None else '')" "$REDIS_HOST" "$LEADER_IP_KEY")
            
            if [[ -n "$leader_ip_from_redis" ]]; then
                FINAL_LEADER_IP="$leader_ip_from_redis"
                echo "Info: Leader IP found in Redis. Using IP: $FINAL_LEADER_IP" >&2
                break
            fi
            
            sleep "$WAIT_INTERVAL"
            elapsed_time=$((elapsed_time + WAIT_INTERVAL))
        done

        if [[ -z "$FINAL_LEADER_IP" ]]; then
            echo "Error: Timed out waiting for the leader IP in Redis after $WAIT_TIMEOUT seconds." >&2
            exit 1
        fi
    fi

    # --- SET AND EXPORT ENVIRONMENT VARIABLES ---
    declare -A env_vars;
    
    env_vars["NCCL_SOCKET_IFNAME"]="${primary_ifname}";
    env_vars["PRIMARY_IFNAME"]="${primary_ifname}";
    env_vars["LOCAL_PRIMARY_IP"]="${local_primary_ip}";
    #env_vars["LWS_LEADER_ADDRESS"]="${FINAL_LEADER_IP}";
    
    # VLLM_NIXL_SIDE_CHANNEL_HOST must be the pod's OWN IP, not the leader's.
    env_vars["VLLM_NIXL_SIDE_CHANNEL_HOST"]="${local_primary_ip}";
    
    env_vars["FINAL_LEADER_IP"]="${FINAL_LEADER_IP}";
    env_vars["MASTER_ADDR"]="${FINAL_LEADER_IP}";
    env_vars["MASTER_PORT"]="29500";
    env_vars["LWS_WORKER_INDEX"]="${LWS_WORKER_INDEX}"; # Add the index to the exported list

    # --- GENERATE EXPORT SCRIPT ---
    EXPORT_FILE="/data/vllm_env_${HOSTNAME}.sh"
    echo "#!/bin/bash" > "$EXPORT_FILE"
    echo "# Auto-generated by discover.sh on $(date)" >> "$EXPORT_FILE"
    while IFS= read -r key; do value="${env_vars[$key]}"; printf "export %s='%s'\n" "$key" "$value" >> "$EXPORT_FILE"; done < <(printf "%s\n" "${!env_vars[@]}")
    echo "--- Discovery script finished successfully. Environment variables saved to $EXPORT_FILE ---" >&2
