apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Patches mooncake-specific env vars, volume, and volumeMount onto the vLLM
# container in both prefill and decode LeaderWorkerSets. The kv-transfer-config
# (MultiConnector with MooncakeStoreConnector) stays in the base manifests;
# this component provides the runtime config that MooncakeStoreConnector needs.
patches:
  - target:
      kind: LeaderWorkerSet
    patch: |-
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: MOONCAKE_CONFIG_PATH
          value: /etc/mooncake/mooncake_config.json
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/env/-
        value:
          name: PYTHONHASHSEED
          value: "0"
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/volumes/-
        value:
          name: mooncake-config
          configMap:
            name: mooncake-kimi-k3-config
      - op: add
        path: /spec/leaderWorkerTemplate/workerTemplate/spec/containers/0/volumeMounts/-
        value:
          name: mooncake-config
          mountPath: /etc/mooncake
          readOnly: true
