apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kimi-K3: 3 prefill replicas (TP16, 2 nodes each) + 1 decode replica (TP16, 2 nodes) -> 8 nodes / 64 GPUs.
resources:
  - ../../providers/coreweave
patches:
  - target:
      kind: LeaderWorkerSet
      name: ".*-prefill"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
  - target:
      kind: LeaderWorkerSet
      name: ".*-decode"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/leaderWorkerTemplate/size
        value: 2
